---
- name: "Install syncthing"
  apt:
    name: "syncthing"
    state: "present"
  become: yes

- name: "Enable/start syncthing"
  systemd:
    name: "syncthing"
    state: "started"
    scope: "user"
    enabled: yes

- name: "Wait until the file config.xml is present"
  wait_for:
    path: "{{ syncthing_directory }}/config.xml"
    state: "present"

- name: "Define syncthing port"
  lineinfile:
    path: "{{ syncthing_directory }}/config.xml"
    regexp: '^(\s+)<address>127\.0\.0\.1'
    line: '\1<address>127.0.0.1:{{ syncthing_port }}</address>'
    backrefs: yes
  notify: "Restart syncthing"
